name: Backfill Entry Sources (Exa)

on:
  schedule:
    # Run every night at 2am UTC — zero agent tokens, uses Exa REST directly
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      start_entry:
        description: 'Start entry number (0 = auto-detect lowest unsourced)'
        default: '0'
      end_entry:
        description: 'End entry number'
        default: '9999'
      batch_size:
        description: 'Entries to process per run'
        default: '200'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Check DB health (skip silently if quota exhausted)
        id: db_health
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          node -e "
          const { neon } = require('@neondatabase/serverless');
          const sql = neon(process.env.DATABASE_URL);
          sql\`SELECT 1\`
            .then(() => { console.log('DB: OK'); process.exit(0); })
            .catch(e => {
              if (e.message && e.message.includes('402')) {
                console.log('DB: QUOTA_EXHAUSTED — skipping run silently');
                process.exit(2);
              }
              console.log('DB: ERROR', e.message?.slice(0,80));
              process.exit(1);
            });
          " && echo "db_ok=true" >> $GITHUB_OUTPUT || (
            code=$?
            if [ $code -eq 2 ]; then
              echo "db_ok=false" >> $GITHUB_OUTPUT
              echo "Neon quota exhausted — skipping silently"
              exit 0
            fi
            exit $code
          )

      - name: Run source backfill
        if: steps.db_health.outputs.db_ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          EXA_API_KEY_3: ${{ secrets.EXA_API_KEY_3 }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '200' }}
          START_ENTRY: ${{ github.event.inputs.start_entry || '0' }}
          END_ENTRY: ${{ github.event.inputs.end_entry || '9999' }}
        run: node scripts/backfill-sources-auto.mjs
